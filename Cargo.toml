[workspace]
members = ["crates/ferroocr-cli"]
exclude = ["spike/upstream"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FerroOCR contributors"]

# 体积与性能优先：上游 workspace 用 opt-level="z" + panic="abort"，
# 我们作为外部依赖时以本 workspace 的 profile 为准（PRD C5 / §7.2）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
